<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>slice</title>
<style>
  html, body { margin: 0; background: #070A12; overflow: hidden; }
  iframe { border: 0; display: block; }
</style>
</head>
<body>
<iframe id="f" src="/" title="slice"></iframe>
<script>
  /* Renders the site at a chosen width, scrolled to an offset or an element.
     The iframe is kept at the window's own height so viewport units (svh)
     resolve the way they would on a real screen. */
  var q = new URLSearchParams(location.search);
  var w = parseInt(q.get('w') || '1440', 10);
  var y = parseInt(q.get('y') || '0', 10);
  var id = q.get('id');
  var pad = parseInt(q.get('pad') || '40', 10);

  var f = document.getElementById('f');
  f.style.width = w + 'px';
  f.style.height = window.innerHeight + 'px';

  f.addEventListener('load', function () {
    var win = f.contentWindow;
    var doc = f.contentDocument;
    doc.documentElement.style.scrollBehavior = 'auto';

    setTimeout(function () {
      var top = y;
      if (id) {
        var el = doc.getElementById(id);
        if (el) top = el.getBoundingClientRect().top + win.scrollY - pad;
      }
      win.scrollTo(0, top);
    }, 400);
  });
</script>
</body>
</html>
